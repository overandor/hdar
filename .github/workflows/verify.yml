name: HDAR Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-python:
    name: Python Verifier + Self-Tests + Proof
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest tests/ -v

      - name: Run CLI self-tests
        run: hdar test

      - name: Run cross-platform proof (local)
        run: python -m hdar.prove --local-only --out /tmp/hdar_proof

  verify-rust:
    name: Independent Rust Verifier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust verifier
        run: |
          cd rust_verifier
          cargo build --release

      - name: Run proof and verify with Rust
        run: |
          python -m hdar.prove --local-only --out /tmp/hdar_proof
          ./rust_verifier/target/release/hdar-verify \
            --host-a-dir /tmp/hdar_proof \
            --host-b-report /tmp/hdar_proof/host_b/host_b_report.json \
            --e2-capsule /tmp/hdar_proof/host_b/capsule_epoch_2 || true
          echo "Rust verifier run completed (platform separation expected to fail in local mode)"
