name: HDAR Reproduction Matrix

on:
  workflow_dispatch:
    inputs:
      release_bundle_url:
        description: 'URL to download release_bundle.tar.gz (or leave empty to build from current commit)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  host-b-matrix:
    name: Host B on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-14, macos-13]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run Host B proof on this platform
        run: |
          python -m hdar.prove --local-only --out ./host_b_output

      - name: Upload Host B evidence
        uses: actions/upload-artifact@v4
        with:
          name: host-b-${{ matrix.os }}
          path: |
            host_b_output/
          retention-days: 90

  verify-matrix:
    name: Verify Reproduction Matrix
    needs: host-b-matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Download all Host B reports
        uses: actions/download-artifact@v4
        with:
          pattern: host-b-*
          merge-multiple: false
          path: /tmp/host_b_reports/

      - name: List downloaded artifacts
        run: |
          find /tmp/host_b_reports/ -name "verifier_report.json" | sort

      - name: Run cross-verification across all platforms
        run: |
          python -c "
          import json, os, glob
          reports = glob.glob('/tmp/host_b_reports/host-b-*/verifier_report.json')
          all_passed = True
          for r in sorted(reports):
              data = json.load(open(r))
              platform = r.split('host-b-')[1].split('/')[0]
              passed = data.get('all_checks_passed', False)
              print(f'  {platform}: {\"PASS\" if passed else \"FAIL\"} ({data.get(\"passed\",0)}/{data.get(\"total_checks\",0)})')
              if not passed:
                  all_passed = False
          print(f'\nAll platforms passed: {all_passed}')
          exit(0 if all_passed else 1)
          "
