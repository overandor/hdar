[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hdar"
version = "1.0.0"
description = "HDAR — Hardware-Detached Agent Runtime: unified SDK, portable protocol, cross-platform proof, and MorphOS integration. Seed-ready."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "overandor"}]
keywords = ["hdar", "attestation", "merkle", "provenance", "capsule", "reproducibility", "agent-runtime", "morphos", "cross-platform"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "cryptography>=42",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "twine>=5"]
e2b = ["e2b>=1.0"]

[project.scripts]
hdar = "hdar.cli:main"

[project.urls]
Homepage = "https://github.com/overandor/hdar"
Repository = "https://github.com/overandor/hdar"

[tool.hatch.build.targets.wheel]
packages = ["hdar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
